[project]
name = "rossoctl-keda1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "kafka-python>=3.0.11",
  "cloudevents>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rossoctl-eventbridge = "eventbridge.__main__:main"
rossoctl-eventrunner = "eventrunner.__main__:main"
# There is deliberately no `rossoctl-e2e-test` here. DESIGN §6a sketched a `tests_e2e`
# package, and an entry point for it was registered before it existed — hatchling
# silently skips a missing name in `packages`, so the wheel built and installed fine
# and shipped a console script that died on `ModuleNotFoundError: tests_e2e` only when
# someone ran it. The harness it promised was instead written as ordinary scripts:
# scripts/docker_e2e_test.py (containers), scripts/k8s_e2e_test.py (cluster) and
# scripts/k8s_demo_flow.py (the §16 four-stage flow). If a packaged entry point is
# wanted again, add the package first and point this at something importable.

[tool.uv]
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eventbridge", "eventrunner", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Without this section these files inherit the repository root's ruff config,
# which targets py311 — while this package requires >=3.14 and uses the free-
# threaded build. The root config is right for the agents and tools beside it;
# it is simply not describing this package.
[tool.ruff]
line-length = 120
# py313 rather than py314: the pinned ruff 0.11.4 does not recognise py314 yet
# ("unknown variant"). This is still closer than the root's py311, and can be
# raised once the pin moves.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501/E402/W291 are ignored at the root too; kept here so this section is a
# complete description rather than a partial override.
#
# E701/E702 are the deliberate house style of this package: one-line
# `try: x` / `except Exception: pass` around best-effort cleanup, and paired
# `a = 1; b = 2` assignments. Expanding ~40 of them would add vertical noise to
# shutdown and error paths whose brevity is the point, so the style is declared
# rather than rewritten.
ignore = ["E501", "E402", "W291", "E701", "E702"]
